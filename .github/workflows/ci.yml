name: CI Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-test.txt
            fmqa/setup.py
            bbo_via_fmqa/setup.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install ./fmqa ./bbo_via_fmqa -r requirements-test.txt
          python -m pip check
      - name: Run installed-package tests
        env:
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          cd "$RUNNER_TEMP"
          python -m pytest --import-mode=importlib "$GITHUB_WORKSPACE/bbo_via_fmqa/tests" -v --cov=bbo_via_fmqa --cov=fmqa --cov-report=xml:coverage.xml --cov-report=term
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: ${{ runner.temp }}/coverage.xml
